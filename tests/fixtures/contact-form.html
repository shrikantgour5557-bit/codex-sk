<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepPilot contact form fixture</title>
<style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:0 20px}label{display:block;margin:18px 0 5px}input,textarea{width:100%;padding:10px;font:inherit}small{color:#58677b}</style>
<h1>Contact us</h1><p>Contact form fixture for StepPilot. No form submission is performed.</p>
<form>
  <label for="full-name">Full name</label><input id="full-name" name="full_name" autocomplete="name" required>
  <label for="email">Email address</label><input id="email" name="email" type="email" aria-describedby="email-help" required><small id="email-help">We will reply to this address.</small>
  <label for="message">Message</label><textarea id="message" name="message" maxlength="500" required></textarea>
</form>
</html>
